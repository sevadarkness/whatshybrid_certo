<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Kanban - WhatsHybrid CRM</title>
    <style>
      :root {
        /* Paleta oficial (AI modern): Roxo / Azul / Preto */
        --wh-purple: #8b5cf6;
        --wh-blue: #3b82f6;
        --wh-black: #020617;

        /* Aliases (compatibilidade, sem cores antigas) */
        --wh-green: var(--wh-purple);
        --wh-dark: var(--wh-black);
        --wh-bg: #0b1020;
        --wh-surface: rgba(15, 23, 42, 0.92);
        --wh-border: rgba(148, 163, 184, 0.35);
        --wh-text: #e5e7eb;
        --wh-muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, rgba(139, 92, 246, 0.12), rgba(2, 6, 23, 1));
        color: var(--wh-text);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.35);
      }
      header .title-block {
        display: flex;
        flex-direction: column;
      }
      header .title-block span.subtitle {
        font-size: 11px;
        color: rgba(226, 232, 240, 0.9);
      }
      header h1 {
        margin: 0;
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      header h1 span.logo {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      #syncBtn {
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(139, 92, 246, 0.9);
        color: #e0f2f1;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #syncBtn:hover {
        background: rgba(13, 148, 136, 1);
      }
      main {
        display: flex;
        align-items: flex-start;
        padding: 14px;
        gap: 12px;
        overflow-x: auto;
        height: calc(100vh - 56px);
      }
      .column {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 10px;
        padding: 10px;
        min-width: 260px;
        max-width: 300px;
        display: flex;
        flex-direction: column;
        max-height: 100%;
        box-shadow: 0 1px 5px rgba(15, 23, 42, 0.15);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .column-header {
        font-weight: 600;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }
      .column-header span.count {
        font-size: 11px;
        background: #e5f6f0;
        color: #047857;
        border-radius: 999px;
        padding: 2px 7px;
      }
      .column-body {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 4px;
        margin-right: -4px;
        padding-right: 4px;
      }
      .column-body::-webkit-scrollbar {
        width: 4px;
      }
      .column-body::-webkit-scrollbar-thumb {
        background: #cbd5f5;
        border-radius: 999px;
      }
      .card {
        background: #ffffff;
        border-radius: 8px;
        padding: 6px 8px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
        cursor: grab;
        position: relative;
        border: 1px solid #e5e7eb;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border-top: 3px solid #8b5cf6;
        opacity: 0.9;
      }
      .card:hover {
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.16);
        transform: translateY(-1px);
      }
      .card strong {
        font-size: 13px;
      }
      .card small {
        color: var(--wh-muted);
        font-size: 11px;
      }
      .card .tags {
        margin-top: 4px;
      }
      .tag {
        display:inline-block;
        padding:2px 6px;
        border-radius:999px;
        font-size:10px;
        margin-right:3px;
        margin-bottom: 2px;
        background:#e5e7eb;
        color:#374151;
      }
      .empty-hint {
        font-size: 11px;
        color: #9ca3af;
        padding: 4px 0 2px;
      }
    
      /* === WhatsHybrid Futuristic Visual Overlay v6 === */
      body {
        background:
          radial-gradient(circle at top left, #1e293b 0, #020617 40%, #000000 100%);
        color: #e5e7eb;
      }
      body, input, textarea, select, button {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 18px 35px rgba(15, 23, 42, 0.85);
        background:
          linear-gradient(120deg, rgba(15, 23, 42, 0.98), rgba(8, 47, 73, 0.98));
      }
      header h1, header h2 {
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      header .title-block p,
      header p {
        color: #94a3b8;
      }

      .card,
      .wh-card,
      .panel,
      .tile {
        background:
          radial-gradient(circle at top left,
            rgba(15, 23, 42, 0.98),
            rgba(15, 23, 42, 0.92));
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.38);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.85);
        position: relative;
        overflow: hidden;
      }
      .card::after,
      .wh-card::after,
      .panel::after {
        content: "";
        position: absolute;
        inset: -40%;
        background: radial-gradient(circle at top,
          rgba(56, 189, 248, 0.16),
          transparent 60%);
        opacity: 0;
        transition: opacity 0.35s ease-out, transform 0.35s ease-out;
        transform: translate3d(-15%, -20%, 0);
        pointer-events: none;
      }
      .card:hover::after,
      .wh-card:hover::after,
      .panel:hover::after {
        opacity: 1;
        transform: translate3d(-5%, -10%, 0);
      }

      button,
      .btn,
      input[type="submit"] {
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.55);
        background-image: linear-gradient(135deg, #8b5cf6, #3b82f6, #1d4ed8);
        color: #0b1120;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding-inline: 14px;
        padding-block: 8px;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.45);
        cursor: pointer;
        transition:
          transform 0.16s ease-out,
          box-shadow 0.16s ease-out,
          filter 0.16s ease-out,
          background-position 0.2s ease-out;
        background-size: 180% 180%;
        background-position: 0% 50%;
      }
      button:hover,
      .btn:hover,
      input[type="submit"]:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 40px rgba(139, 92, 246, 0.55);
        filter: saturate(1.1);
        background-position: 100% 50%;
      }
      button:disabled,
      .btn:disabled,
      input[type="submit"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }

      .btn-secondary,
      .btn-outline {
        background-image: linear-gradient(135deg, #020617, #020617);
        color: #e5e7eb;
        border-color: rgba(148, 163, 184, 0.7);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.7);
      }

      .tag-pill,
      .status-pill,
      .label-pill,
      .pill {
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.5);
        background:
          radial-gradient(circle at top left,
            rgba(34, 197, 94, 0.18),
            rgba(56, 189, 248, 0.15));
        color: #e0f2fe;
        padding: 4px 10px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .section-title {
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 11px;
        color: #a5b4fc;
      }

      /* Compact futuristic scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.85);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8b5cf6, #3b82f6);
        border-radius: 999px;
      }

      .input,
      input[type="text"],
      input[type="number"],
      input[type="email"],
      input[type="password"],
      textarea,
      select {
        background: rgba(15, 23, 42, 0.92);
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.5);
        color: #e5e7eb;
        padding: 8px 10px;
        outline: none;
        transition:
          border-color 0.16s ease-out,
          box-shadow 0.16s ease-out,
          background 0.16s ease-out;
      }
      .input::placeholder,
      textarea::placeholder {
        color: #64748b;
      }
      .input:focus,
      input[type="text"]:focus,
      input[type="number"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(56, 189, 248, 0.9);
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.8);
        background: rgba(15, 23, 42, 0.98);
      }

      /* Charts grid (used in analytics.html; harmless elsewhere) */
      .charts-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 18px;
      }
      .chart-card {
        padding: 14px 16px 12px;
      }
      .chart-card.full-width {
        grid-column: 1 / -1;
      }
      .chart-card h2 {
        margin: 0 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: #e5e7eb;
      }
      .chart-caption {
        margin-top: 8px;
        font-size: 11px;
        color: #94a3b8;
      }
      .chart-shell {
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background:
          radial-gradient(circle at top,
            rgba(15, 23, 42, 0.98),
            rgba(15, 23, 42, 0.92));
        padding: 6px 8px;
      }
      .chart-shell canvas {
        width: 100%;
        height: 230px;
        display: block;
        border-radius: 10px;
      }

    
      header .title-block h1 span.logo img {
        width: 22px;
        height: 22px;
        display: block;
        border-radius: 999px;
      }
    
    </style>
  </head>
  <body>
    <header>
      <div class="title-block">
        <h1><span class="logo"><img src="icons/logo_quantum.png" alt="WA Hybrid CRM Quantum" /></span> Kanban & Funil</h1>
        <span class="subtitle">Organize seus leads arrastando entre estágios.</span>
      </div>
      <button id="syncBtn">🔄 Atualizar dados</button>
    </header>
    <main id="kanban"></main>
    <script src="license_client.js"></script>
    <script src="whatsHybrid.bridge.js"></script>
    <script src="dashboard.js"></script>
  <button id="btnExportCSV" style="position:fixed;bottom:32px;right:38px;z-index:9998;background:#178a4b;color:white;font-weight:bold;padding:12px 16px;border:none;border-radius:6px;cursor:pointer;box-shadow:0 2px 10px #0003;">Exportar CRM (CSV)</button>
</body>
</html>
