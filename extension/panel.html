<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum CRM - Workspace</title>
    <link rel="stylesheet" href="panel.css">
    <link rel="stylesheet" href="assets/workspace-icons.css">
    <link rel="stylesheet" href="assets/shared-components.css">
    <link rel="stylesheet" href="charts/charts.css">
    <link rel="icon" href="icons/icon32.png">
</head>
<body>
    <div id="app" class="workspace">
        <!-- ========================================== -->
        <!-- SIDEBAR DE NAVEGAÇÃO -->
        <!-- ========================================== -->
        <aside id="sidebar" class="sidebar">
            <!-- Logo/Brand -->
            <div class="sidebar-header">
                <div class="brand">
                    <img src="icons/logo_quantum.png" alt="Quantum" class="brand-logo">
                    <span class="brand-name">Quantum</span>
                </div>
                <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" title="Recolher menu">
                    <span class="icon">☰</span>
                </button>
            </div>

            <!-- Status de Conexão -->
            <div id="connection-status" class="connection-status disconnected">
                <span class="status-dot"></span>
                <span class="status-text">Desconectado</span>
            </div>

            <!-- Menu Principal -->
            <nav class="sidebar-nav">
    <div class="nav-section">
        <span class="nav-section-title">Inbox</span>
        <button class="nav-item" data-module="chats" data-shortcut="I">
            <span class="nav-icon">📥</span>
            <span class="nav-label">Inbox</span>
            <span class="nav-badge" id="badge-chats"></span>
        </button>
    </div>

    <div class="nav-section">
        <span class="nav-section-title">Contato / CRM</span>
        <button class="nav-item" data-module="contacts" data-shortcut="C">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Contatos</span>
        </button>

        <button class="nav-item" data-module="labels" data-shortcut="L">
            <span class="nav-icon">🏷️</span>
            <span class="nav-label">Tags / Rótulos</span>
        </button>
    </div>

    <div class="nav-section">
        <span class="nav-section-title">Campanhas (Bulk)</span>
        <button class="nav-item" data-module="bulk" data-shortcut="B">
            <span class="nav-icon">📨</span>
            <span class="nav-label">Campanhas</span>
            <span class="nav-badge" id="badge-bulk"></span>
        </button>
    </div>

    <div class="nav-section">
        <span class="nav-section-title">IA</span>

        <button class="nav-item" data-module="smart-replies" data-shortcut="R">
            <span class="nav-icon">🤖</span>
            <span class="nav-label">Sugestões IA</span>
        </button>
    </div>

    <div class="nav-section">
        <span class="nav-section-title">Analytics / Config</span>

        <button class="nav-item active" data-module="dashboard" data-shortcut="D">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Overview</span>
            <span class="nav-badge" id="badge-dashboard"></span>
        </button>

        <button class="nav-item" data-module="analytics" data-shortcut="A">
            <span class="nav-icon">📈</span>
            <span class="nav-label">Analytics</span>
        </button>

        <button class="nav-item" data-module="extractor" data-shortcut="E">
            <span class="nav-icon">📥</span>
            <span class="nav-label">Extrator</span>
        </button>

        <button class="nav-item" data-module="team" data-shortcut="T">
            <span class="nav-icon">👨‍👩‍👧‍👦</span>
            <span class="nav-label">Equipe</span>
        </button>

        <button class="nav-item" data-module="settings" data-shortcut="S">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Configurações</span>
        </button>

        <button class="nav-item" data-module="help" data-shortcut="H">
            <span class="nav-icon">❓</span>
            <span class="nav-label">Ajuda</span>
        </button>
    </div>
</nav>

            <!-- Rodapé do Sidebar -->
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">👤</div>
                    <div class="user-details">
                        <span class="user-name" id="user-name">Usuário</span>
                        <span class="user-plan" id="user-plan">Free</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ========================================== -->
        <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
        <!-- ========================================== -->
        <main id="main-content" class="main-content">
            <!-- Header do Conteúdo -->
            <header id="content-header" class="content-header">
                <div class="header-left">
                    <button id="btn-back" class="btn-header hidden" title="Voltar">
                        <span class="icon">←</span>
                    </button>
                    <h1 id="page-title" class="page-title">Dashboard</h1>
                    <span id="page-subtitle" class="page-subtitle"></span>
                </div>

                <div class="header-center">
                    <!-- Barra de busca global -->
                    <div class="global-search">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="global-search" readonly placeholder="Comandos e busca... (Ctrl+K)">
                        <kbd class="search-shortcut">Ctrl+K</kbd>
                    </div>
                </div>

                <div class="header-right">
                <div id="credits-widget"></div>
                    <!-- Ações rápidas -->
                    <button id="btn-quick-message" class="btn-header" title="Nova mensagem (N)">
                        <span class="icon">✉️</span>
                    </button>
                    <button id="btn-refresh" class="btn-header" title="Atualizar (F5)">
                        <span class="icon">🔄</span>
                    </button>
                    <button id="btn-notifications" class="btn-header" title="Notificações">
                        <span class="icon">🔔</span>
                        <span class="notification-badge" id="notification-count">0</span>
                    </button>
                    <button id="btn-fullscreen" class="btn-header" title="Tela cheia (F11)">
                        <span class="icon">⛶</span>
                    </button>
                </div>
            </header>

            <!-- Breadcrumb -->
            <nav id="breadcrumb" class="breadcrumb hidden">
                <a href="#" data-module="dashboard">Dashboard</a>
                <span class="separator">/</span>
                <span class="current" id="breadcrumb-current"></span>
            </nav>

            <!-- Container dos Módulos -->
            <div id="module-container" class="module-container">
                <!-- Loading State -->
                <div id="module-loading" class="module-loading hidden">
                    <div class="loading-spinner"></div>
                    <p>Carregando módulo...</p>
                </div>

                <!-- Error State -->
                <div id="module-error" class="module-error hidden">
                    <span class="error-icon">⚠️</span>
                    <h2>Erro ao carregar módulo</h2>
                    <p id="error-message"></p>
                    <button id="btn-retry" class="btn primary">Tentar novamente</button>
                </div>

                <!-- Module Content (será preenchido dinamicamente) -->
                <div id="module-content" class="module-content"></div>
            </div>
        </main>

        <!-- ========================================== -->
        <!-- PAINEL LATERAL DIREITO (CONTEXTO) -->
        <!-- ========================================== -->
        <aside id="context-panel" class="context-panel hidden">
            <div class="context-header">
                <h3 id="context-title">Detalhes</h3>
                <button id="btn-close-context" class="btn-close">✕</button>
            </div>
            <div id="context-content" class="context-content"></div>
        </aside>

        <!-- ========================================== -->
        <!-- MODAIS GLOBAIS -->
        <!-- ========================================== -->

        <!-- Modal de Busca Global -->
        <div id="search-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content search-modal-content">
                <div class="search-modal-header">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-modal-input" placeholder="Digite para buscar..." autofocus>
                    <button class="btn-close">✕</button>
                </div>
                <div id="search-results" class="search-results">
                    <div class="search-section">
                        <h4>Ações Rápidas</h4>
                        <div class="search-actions">
                            <button data-action="new-message">✉️ Nova Mensagem</button>
                            <button data-action="new-campaign">📨 Nova Campanha</button>
                            <button data-action="new-flow">🔄 Novo Flow</button>
                            <button data-action="export-data">📥 Exportar Dados</button>
                        </div>
                    </div>
                    <div class="search-section">
                        <h4>Resultados</h4>
                        <div id="search-results-list" class="search-results-list">
                            <p class="empty-state">Digite para buscar contatos, conversas, campanhas...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Genérico -->
        <div id="generic-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title"></h3>
                    <button id="btn-close-modal" class="btn-close">✕</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
                <div id="modal-footer" class="modal-footer"></div>
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Command Palette (Ctrl+K) -->
        <div id="command-palette" class="command-palette hidden">
            <div class="palette-overlay"></div>
            <div class="palette-content">
                <input type="text" id="command-input" placeholder="Digite um comando...">
                <div id="command-list" class="command-list"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Utils (core) -->
    <script src="utils/event-bus.js"></script>
    <script src="utils/module-registry.js"></script>
    <script src="utils/selector-engine.js"></script>
    <script src="utils/notification-center.js"></script>
    <script src="utils/initialization-manager.js"></script>

    <script src="workspace/state-manager.js"></script>
    <script src="workspace/module-loader.js"></script>
    <script src="workspace/workspace.js"></script>
    <!-- Sistema de assinaturas e créditos -->
    <script src="subscription/subscription-manager.js"></script>
    <script src="subscription/credits-manager.js"></script>
    <script src="subscription/feature-gate.js"></script>
    <script src="subscription/subscription-ui.js"></script>
    <script src="charts/chart-engine.js"></script>
    <script src="charts/data-aggregator.js"></script>
    <script src="workspace/modules/dashboard/dashboard-charts.js"></script>
    <script src="workspace/modules/analytics/analytics-charts.js"></script>
    <script src="workspace/modules/team/team-charts.js"></script>
    <script src="workspace/modules/flows/flows-charts.js"></script>
    <script src="workspace/modules/bulk/bulk-charts.js"></script>
    <script src="whatsHybrid.bridge.js"></script>
    <script src="panel.js"></script>
</body>
</html>
