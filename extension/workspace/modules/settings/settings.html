<!-- workspace/modules/settings/settings.html -->
<div class="whs-module whs-settings" data-module="settings">
  <div class="whs-module-header">
    <div>
      <h2>Configurações</h2>
      <div class="whs-module-subtitle">Preferências da extensão (backend, IA, funil, tags)</div>
    </div>
    <div class="whs-actions">
      <button class="btn secondary" id="whs-settings-open">Abrir página de opções</button>
      <button class="btn secondary" id="whs-settings-reload">Recarregar</button>
    </div>
  </div>

  <div class="whs-embed">
    <iframe id="whs-settings-iframe" class="whs-iframe" title="Configurações" referrerpolicy="no-referrer"></iframe>
  </div>
</div>
